name: ResoFlex production checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Full repository lint baseline
        run: npm run lint
        continue-on-error: true

      - name: Lint changed storefront modules
        run: npx eslint src/lib/attribution.ts src/lib/liveCatalog.ts src/pages/ProductPage.tsx src/components/sales/CheckoutModal.tsx src/components/sales/LiveRecommendedProducts.tsx src/pages/Index.tsx src/components/sales/StoreDiscovery.tsx

      - name: Unit tests
        run: npm test

      - name: Catalog integrity
        run: npm run catalog:check

      - name: Production build
        run: npm run build
